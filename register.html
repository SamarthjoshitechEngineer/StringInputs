<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-style: italic;
            background-color: rgb(255, 0, 221);
            display:flex;
            align-items: center;
            justify-content: center;
        }
     .best{
            margin-left: 235px;
            width: 90px;
            background-color: rgb(44, 160, 222);
            border-radius: 2px;
            border-width: 5px;
            border-color: rgb(65, 178, 249);
            cursor: pointer;
        }
        .best:hover{
            background-color: rgb(7, 83, 7);
        }
        .Back{
            border-color: rgb(45, 226, 60);
            border-width:5px;
            color: black;
            background-color:rgb(45, 226, 60);
        }
        #register-container{
            padding: 70px;
            margin-top: 50px;
            background-color: white;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="register-container">
        <h2>Registration</h2>
        <form id="detailform">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" required placeholder="Enter phone number" minlength="10" max="10" pattern="[0-9]{10}" title="The phone number should be 10 digits">
            <button type="submit" class="best">Submit</button>  
         <button type="reset" class="Back"><a href="LoginForm.html">Back to Login</a></button>
        </form>
    </div>
</body>
</html>
